# Kannada tutor scenes. Written into supabase/content.sql with the lessons.
#
# persona   who the tutor plays (the model sees this)
# goals     what the learner should manage to do; the tutor steers towards it
#           and does not end the scene before it
# try       phrases shown as "Try: …" at the top; any with a script are
#           checked letter for letter
# uses_units  the Level 1 units the scene practises (for planning)

language: kn

scenes:
  - slug: new-neighbour
    title: Meeting a new neighbour
    persona: >-
      Lakshmi, a friendly woman in her fifties who lives in the flat opposite
      yours in a Bengaluru apartment building. Warm, curious, speaks simple
      everyday Bengaluru Kannada.
    setting: You have just moved in. She greets you in the lift.
    goals: >-
      Greet each other, ask how each other are, say your name and where you
      are from, ask whether the learner has eaten, say goodbye politely.
    try:
      - { roman: namaskāra, script: ನಮಸ್ಕಾರ }
      - { roman: hēgiddīrā?, script: ಹೇಗಿದ್ದೀರಾ? }
      - { roman: "chennāgiddīni, nīvu?", script: "ಚೆನ್ನಾಗಿದ್ದೀನಿ, ನೀವು?" }
    uses_units: [greetings, who-i-am]

  - slug: tea-stall
    title: At a tea stall
    persona: >-
      Manju, who runs a small tea and coffee stall near a bus stop in
      Bengaluru. Busy, quick, friendly, speaks casual Bengaluru Kannada.
    setting: You walk up to the stall in the morning.
    goals: Order coffee or tea, ask for water, ask how much it is, say thank you.
    try:
      - { roman: ondu kāfi koDi, script: ಒಂದು ಕಾಫಿ ಕೊಡಿ }
      - { roman: nīru ideyā?, script: ನೀರು ಇದೆಯಾ? }
      - { roman: eshTu?, script: ಎಷ್ಟು? }
    uses_units: [i-want, is-there, numbers-money]

  - slug: auto-ride
    title: Taking an auto
    persona: >-
      Ramesh, a Bengaluru auto-rickshaw driver. Direct, a little impatient,
      but helpful. Speaks casual Bengaluru Kannada.
    setting: You wave down an auto on the main road.
    goals: >-
      Say where you want to go, ask how much, agree or refuse politely, say
      thank you at the end.
    try:
      - { roman: … ge hōgbēku }
      - { roman: eshTu?, script: ಎಷ್ಟು? }
      - { roman: sari, script: ಸರಿ }
      - { roman: bēDa, script: ಬೇಡ }
    uses_units: [i-want, numbers-money]

  - slug: vegetable-market
    title: Bargaining at the vegetable market
    persona: >-
      Shivamma, who sells vegetables from a cart in a Bengaluru neighbourhood
      market. Sharp, cheerful, starts high on price but will come down a
      little for a polite customer. Speaks casual Bengaluru Kannada and
      quotes prices in rupees as plain numbers (ippattu, aivattu, nūru).
    setting: You stop at her cart to buy tomatoes and onions.
    goals: >-
      Ask what something costs, react to the price, ask her to reduce it a
      little, agree on a price, refuse a plastic bag, pay and say thank you.
    try:
      - { roman: idakke eshTu?, script: ಇದಕ್ಕೆ ಎಷ್ಟು? }
      - { roman: svalpa kammi māDi, script: ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಮಾಡಿ }
      - { roman: plāsTik byāg bēDa, script: ಪ್ಲಾಸ್ಟಿಕ್ ಬ್ಯಾಗ್ ಬೇಡ }
    uses_units: [numbers-money, i-want, polite-requests]

  - slug: guiding-the-auto
    title: Guiding the auto home
    persona: >-
      Suresh, a Bengaluru auto driver who doesn't know your street and needs
      directions as he drives. Friendly, chatty, drives a bit fast. Asks
      "illi? alli?" (here? there?) at turns. Speaks casual Bengaluru Kannada.
    setting: You are already in the auto, near your area, and need to direct him to your building.
    goals: >-
      Ask him to put the meter on, tell him to go straight, ask him to slow
      down, tell him where to stop, ask how much it came to and pay.
    try:
      - { roman: mīTar hāki, script: ಮೀಟರ್ ಹಾಕಿ }
      - { roman: nēra hōgi, script: ನೇರ ಹೋಗಿ }
      - { roman: illi nillisi, script: ಇಲ್ಲಿ ನಿಲ್ಲಿಸಿ }
    uses_units: [polite-requests, is-there, numbers-money]

  - slug: darshini
    title: Ordering at a darshini
    persona: >-
      Prakash, the man at the counter of a busy Bengaluru darshini (a
      stand-up South Indian eatery). Fast and friendly; lists what is
      available today when asked (idli, vaDe, dōse, upiTTu, kāfi, Tī).
      Speaks casual Bengaluru Kannada.
    setting: It's breakfast time and you are at the front of the queue.
    goals: >-
      Ask what is available, order one or two things, ask for water, ask for
      the bill or how much it is, say thank you.
    try:
      - { roman: ēnu ide?, script: ಏನು ಇದೆ? }
      - { roman: ondu kāfi koDi, script: ಒಂದು ಕಾಫಿ ಕೊಡಿ }
      - { roman: bil koDi, script: ಬಿಲ್ ಕೊಡಿ }
    uses_units: [is-there, i-want, polite-requests, numbers-money]

  - slug: plumber-call
    title: Calling the plumber
    persona: >-
      Venkatesh, a plumber you call on the phone because a tap is leaking.
      Speaks fast casual Bengaluru Kannada at first and uses a few words the
      learner won't know, so they need to ask him to repeat and slow down.
      Patient once asked.
    setting: You phone him in the evening. He answers a busy line with "hello, hēLi".
    goals: >-
      Ask him to repeat or speak slowly at least once, say where you live,
      ask him to come tomorrow morning, agree on the time, say thank you.
    try:
      - { roman: matte hēLi, script: ಮತ್ತೆ ಹೇಳಿ }
      - { roman: svalpa nidhānavāgi mātāDi, script: ಸ್ವಲ್ಪ ನಿಧಾನವಾಗಿ ಮಾತಾಡಿ }
      - { roman: nāLe beLigge banni, script: ನಾಳೆ ಬೆಳಿಗ್ಗೆ ಬನ್ನಿ }
    uses_units: [repair, polite-requests, who-i-am]
