#                     ("nanage svalpa svalpa kannaDa barutte", "nānu kannaDa kalitā iddīni")
#   wikiHow           wikihow.com/Speak-in-Kannada ("haudu, svalpa svalpa barutte")
#   Penn              ccat.sas.upenn.edu/plc/kannada/lesson4.html ("kannaDa gottide",
#                     "ingliS gottide", "illa, kannaDa aSTe gottilla")
